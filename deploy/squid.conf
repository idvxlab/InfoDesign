# 仅允许白名单域名的 HTTPS CONNECT；明确禁止内网、回环与元数据地址。
http_port 3128
# 独立解析公网域名，避免继承宿主代理软件的 198.18.0.0/15 Fake-IP。
# 仍保留下方目标地址拒绝规则；不放行 Fake-IP 或内网网段。
dns_nameservers 223.5.5.5 1.1.1.1
acl CONNECT method CONNECT
acl TLS_port port 443
acl allowed_api dstdomain "/etc/squid/allowed-hosts.txt"
acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8
http_access deny !CONNECT
http_access deny !TLS_port
http_access deny private_dst
http_access allow allowed_api
http_access deny all
cache deny all
access_log none
cache_store_log none
cache_log /dev/stderr
pid_filename /tmp/squid.pid
coredump_dir /tmp
pinger_enable off
shutdown_lifetime 1 seconds
visible_hostname tju-mas-egress
